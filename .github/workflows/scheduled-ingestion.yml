name: Scheduled Ingestion & DataOps

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      league:
        description: 'League to ingest (optional: nba, euroleague)'
        required: false
        default: ''
      days_back:
        description: 'Days back to catch up (default: 1)'
        required: false
        default: '1'

jobs:
  operational_sync:
    name: Daily Ingestion & Audit
    runs-on: ubuntu-latest

    services:
      minio:
        image: pgsty/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        command: server /data

    env:
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: bronze
      S3_REGION: us-east-1
      S3_USE_SSL: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Daily Ingestion Pipeline
        run: |
          LEAGUE_ARG=""
          if [ -n "${{ github.event.inputs.league }}" ]; then
            LEAGUE_ARG="--league ${{ github.event.inputs.league }}"
          fi
          DAYS_BACK="${{ github.event.inputs.days_back || '1' }}"
          
          basket-app daily $LEAGUE_ARG --days-back $DAYS_BACK

      - name: Run Lakehouse Audit
        run: |
          echo "### 🏀 Bronze Lakehouse Inventory Audit" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          basket-app audit --json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
