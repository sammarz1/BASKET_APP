[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "basket-app"
version = "0.1.0"
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
]

[project.scripts]
basket-app = "basket_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["unit-tests", "integration-tests"]
pythonpath = ["src"]
