services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: basket_minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # MinIO Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  createbuckets:
    image: quay.io/minio/mc:latest
    container_name: basket_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      /usr/bin/mc mb -p localminio/bronze;
      echo 'Bronze bucket verified / created.';
      exit 0;
      "

volumes:
  minio_data:
